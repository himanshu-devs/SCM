<aside th:fragment="sidebar"
       id="logo-sidebar"
       class="fixed top-0 left-0 z-40 w-64 h-screen transition-transform -translate-x-full sm:translate-x-0"
       aria-label="Sidebar">

  <div class="flex h-full flex-col bg-white border-r border-gray-200
              dark:bg-gray-900 dark:border-gray-800">

    <!-- Profile: big round image with name underneath -->
    <div class="flex flex-col items-center px-4 pt-8 pb-5 text-center
                border-b border-gray-200 dark:border-gray-800">

      <div class="relative h-24 w-24 shrink-0">
        <!-- Real photo (only rendered when a picture exists) -->
        <img th:if="${loggedInUser.profilePic != null and !#strings.isEmpty(loggedInUser.profilePic)}"
             th:src="@{${loggedInUser.profilePic}}"
             th:alt="${loggedInUser.name}"
             onerror="this.style.display='none'; this.nextElementSibling.classList.remove('hidden');"
             class="h-24 w-24 rounded-full object-cover shadow-md
                    ring-4 ring-teal-100 dark:ring-teal-500/20" />

        <!-- Default avatar: shown when no picture, or when the picture fails to load -->
        <span th:classappend="${loggedInUser.profilePic != null and !#strings.isEmpty(loggedInUser.profilePic)} ? 'hidden'"
              class="flex h-24 w-24 items-center justify-center rounded-full
                     bg-gradient-to-br from-teal-400 to-teal-700 text-white shadow-md
                     ring-4 ring-teal-100 dark:ring-teal-500/20"
              aria-hidden="true">
          <svg class="h-12 w-12" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm0 2c-4.42 0-8 2.24-8 5v1a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-1c0-2.76-3.58-5-8-5Z"/>
          </svg>
        </span>

        <!-- Online dot -->
        <span class="absolute bottom-1.5 right-1.5 h-4 w-4 rounded-full bg-emerald-500
                     ring-2 ring-white dark:ring-gray-900"></span>
      </div>

      <p class="mt-3 max-w-full truncate text-base font-semibold text-gray-900 dark:text-white"
         th:text="${loggedInUser.name}">User name</p>
      <p class="text-xs text-gray-500 dark:text-gray-400">Welcome back</p>
    </div>


    <!-- Navigation -->
    <nav class="flex-1 overflow-y-auto px-3 pt-4 pb-4"
         th:with="link='group flex items-center gap-3 rounded-lg px-3 py-2 text-sm font-medium
                        text-gray-600 transition-colors hover:bg-gray-100 hover:text-gray-900
                        dark:text-gray-300 dark:hover:bg-gray-800 dark:hover:text-white
                        aria-[current=page]:bg-teal-50 aria-[current=page]:text-teal-700
                        dark:aria-[current=page]:bg-teal-500/10 dark:aria-[current=page]:text-teal-300',
                  icon='w-5 text-center text-base text-gray-400 transition-colors
                        group-hover:text-gray-700 dark:text-gray-500 dark:group-hover:text-gray-200
                        group-aria-[current=page]:text-teal-600 dark:group-aria-[current=page]:text-teal-300'">

      <p class="px-3 pb-1 text-xs font-medium text-gray-400 dark:text-gray-500">Overview</p>
      <ul class="mb-5 space-y-1">
        <li>
          <a th:href="@{/user/dashboard}" th:class="${link}">
            <i th:class="'fa-solid fa-chart-pie ' + ${icon}"></i>
            <span>Dashboard</span>
          </a>
        </li>
        <li>
          <a th:href="@{/user/profile}" th:class="${link}">
            <i th:class="'fa-regular fa-user ' + ${icon}"></i>
            <span class="flex-1">Profile</span>
          </a>
        </li>
      </ul>

      <p class="px-3 pb-1 text-xs font-medium text-gray-400 dark:text-gray-500">Contacts</p>
      <ul class="mb-5 space-y-1">
        <li>
          <a th:href="@{/user/contact}" th:class="${link}">
            <i th:class="'fa-regular fa-address-book ' + ${icon}"></i>
            <span>All contacts</span>
          </a>
        </li>
        <li>
          <a th:href="@{/user/contact/add}" th:class="${link}">
            <i th:class="'fa-solid fa-user-plus ' + ${icon}"></i>
            <span>Add contact</span>
          </a>
        </li>
      </ul>

      <p class="px-3 pb-1 text-xs font-medium text-gray-400 dark:text-gray-500">Support</p>
      <ul class="space-y-1">
        <li>
          <a href="#" th:class="${link}">
            <i th:class="'fa-regular fa-message ' + ${icon}"></i>
            <span>Direct message</span>
          </a>
        </li>
        <li>
          <a href="#" th:class="${link}">
            <i th:class="'fa-regular fa-pen-to-square ' + ${icon}"></i>
            <span>Feedback</span>
          </a>
        </li>
      </ul>
    </nav>

    <!-- Footer -->
    <div class="border-t border-gray-200 p-3 dark:border-gray-800">
      <a th:href="@{/logout}"
         class="group flex items-center gap-3 rounded-lg px-3 py-2 text-sm font-medium
                text-gray-600 transition-colors hover:bg-red-50 hover:text-red-600
                dark:text-gray-300 dark:hover:bg-red-500/10 dark:hover:text-red-400">
        <i class="fa-solid fa-arrow-right-from-bracket w-5 text-center text-base text-gray-400
                  group-hover:text-red-500 dark:text-gray-500 dark:group-hover:text-red-400"></i>
        <span>Log out</span>
      </a>
    </div>

    <!-- Marks the link for the current page (works on any Thymeleaf version) -->
    <script>
      (function () {
        var path = window.location.pathname.replace(/\/+$/, '') || '/';
        var links = document.querySelectorAll('#logo-sidebar nav a[href]');
        var best = null;
        links.forEach(function (a) {
          var href = a.getAttribute('href');
          if (!href || href === '#') return;
          var p = a.pathname.replace(/\/+$/, '');
          if ((path === p || path.indexOf(p + '/') === 0) &&
              (!best || p.length > best.pathname.replace(/\/+$/, '').length)) {
            best = a;
          }
        });
        if (best) best.setAttribute('aria-current', 'page');
      })();
    </script>
  </div>
</aside>
