<div th:fragment="contact">

    <!-- Contact Details Modal -->
    <div id="view_contact_modal"
         tabindex="-1"
         role="dialog"
         aria-modal="true"
         aria-labelledby="contact_name"
         aria-hidden="true"
         class="hidden fixed inset-0 z-50 items-center justify-center overflow-y-auto overflow-x-hidden bg-slate-900/60 p-4 backdrop-blur-sm">

        <div class="relative my-auto w-full max-w-2xl">

            <div class="relative overflow-hidden rounded-xl bg-white shadow-xl ring-1 ring-slate-900/10 dark:bg-slate-900 dark:ring-white/10">

                <!-- Header bar -->
                <div class="flex items-center justify-between border-b border-slate-200 px-6 py-4 dark:border-slate-800">
                    <h3 id="contact_name" class="text-base font-semibold text-slate-900 dark:text-white">
                        Contact profile
                    </h3>
                    <button type="button"
                            onclick="closeContactModal()"
                            aria-label="Close modal"
                            class="inline-flex h-9 w-9 items-center justify-center rounded-lg text-slate-500 transition hover:bg-slate-100 hover:text-slate-900 focus:outline-none focus-visible:ring-2 focus-visible:ring-sky-600 dark:text-slate-400 dark:hover:bg-slate-800 dark:hover:text-white">
                        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12"/>
                        </svg>
                    </button>
                </div>

                <!-- Body -->
                <div class="max-h-[70vh] overflow-y-auto">

                    <!-- Profile summary -->
                    <div class="flex flex-col items-center gap-5 bg-slate-50 px-6 py-8 text-center sm:flex-row sm:items-center sm:text-left dark:bg-slate-800/40">
                        <img id="contact_picture"
                             src=""
                             alt="Contact profile picture"
                             class="h-24 w-24 shrink-0 rounded-full bg-slate-200 object-cover ring-4 ring-white shadow-sm dark:bg-slate-700 dark:ring-slate-900"/>

                        <div class="min-w-0 flex-1">
                            <h4 id="profile_name"
                                class="break-words text-2xl font-semibold tracking-tight text-slate-900 dark:text-white">
                                —
                            </h4>
                            <p id="contact_email"
                               class="mt-1 break-all text-sm text-slate-600 dark:text-slate-300">
                                —
                            </p>

                            <div class="mt-4 flex flex-wrap items-center justify-center gap-2 sm:justify-start">
                                <span id="contact_favorite"
                                      class="inline-flex items-center gap-1.5 rounded-full bg-slate-200 px-3 py-1 text-xs font-medium text-slate-700 dark:bg-slate-700 dark:text-slate-200">
                                    <span aria-hidden="true">★</span>
                                    <span id="favorite_text">Not a favorite</span>
                                </span>
                                
                            </div>
                        </div>
                    </div>

                    <div class="space-y-8 px-6 py-6">

                        <!-- Personal information -->
                        <section aria-labelledby="personal_heading">
                            <h4 id="personal_heading" class="text-sm font-semibold text-slate-900 dark:text-white">
                                Personal information
                            </h4>

                            <dl class="mt-3 divide-y divide-slate-200 rounded-lg border border-slate-200 dark:divide-slate-800 dark:border-slate-800">
                                <div class="flex items-start gap-4 px-4 py-3.5">
                                    <svg class="mt-0.5 h-5 w-5 shrink-0 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 6.75c0 8.284 6.716 15 15 15h2.25a2.25 2.25 0 0 0 2.25-2.25v-1.372a1.125 1.125 0 0 0-.852-1.091l-4.423-1.106a1.125 1.125 0 0 0-1.173.417l-.97 1.293a1.125 1.125 0 0 1-1.21.38 12.035 12.035 0 0 1-7.143-7.143 1.125 1.125 0 0 1 .38-1.21l1.293-.97c.363-.272.527-.734.417-1.173L6.963 3.102A1.125 1.125 0 0 0 5.872 2.25H4.5A2.25 2.25 0 0 0 2.25 4.5v2.25Z"/>
                                    </svg>
                                    <div class="min-w-0 flex-1 sm:grid sm:grid-cols-3 sm:gap-4">
                                        <dt class="text-sm text-slate-500 dark:text-slate-400">Phone number</dt>
                                        <dd id="contact_phone"
                                            class="mt-1 break-words text-sm font-medium text-slate-900 sm:col-span-2 sm:mt-0 dark:text-white">
                                            —
                                        </dd>
                                    </div>
                                </div>

                                <div class="flex items-start gap-4 px-4 py-3.5">
                                    <svg class="mt-0.5 h-5 w-5 shrink-0 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/>
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1 1 15 0Z"/>
                                    </svg>
                                    <div class="min-w-0 flex-1 sm:grid sm:grid-cols-3 sm:gap-4">
                                        <dt class="text-sm text-slate-500 dark:text-slate-400">Address</dt>
                                        <dd id="contact_address"
                                            class="mt-1 whitespace-pre-line break-words text-sm font-medium text-slate-900 sm:col-span-2 sm:mt-0 dark:text-white">
                                            —
                                        </dd>
                                    </div>
                                </div>

                                <div class="flex items-start gap-4 px-4 py-3.5">
                                    <svg class="mt-0.5 h-5 w-5 shrink-0 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z"/>
                                    </svg>
                                    <div class="min-w-0 flex-1 sm:grid sm:grid-cols-3 sm:gap-4">
                                        <dt class="text-sm text-slate-500 dark:text-slate-400">Description</dt>
                                        <dd id="contact_description"
                                            class="mt-1 whitespace-pre-wrap break-words text-sm leading-6 text-slate-700 sm:col-span-2 sm:mt-0 dark:text-slate-300">
                                            No description available.
                                        </dd>
                                    </div>
                                </div>
                            </dl>
                        </section>

                        <!-- Online profiles -->
                        <section aria-labelledby="online_heading">
                            <h4 id="online_heading" class="text-sm font-semibold text-slate-900 dark:text-white">
                                Online profiles
                            </h4>

                            <div class="mt-3 grid grid-cols-1 gap-3 sm:grid-cols-2">

                                <a id="contact_website"
                                   href="#"
                                   target="_blank"
                                   rel="noopener noreferrer"
                                   class="group hidden items-center gap-3 rounded-lg border border-slate-200 p-3.5 transition hover:border-sky-300 hover:bg-sky-50/60 focus:outline-none focus-visible:ring-2 focus-visible:ring-sky-600 dark:border-slate-800 dark:hover:border-sky-700 dark:hover:bg-slate-800">
                                    <span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-lg bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-300">
                                        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
                                            <circle cx="12" cy="12" r="10"/>
                                            <path stroke-linecap="round" stroke-linejoin="round" d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10Z"/>
                                        </svg>
                                    </span>
                                    <span class="min-w-0 flex-1">
                                        <span class="block text-xs text-slate-500 dark:text-slate-400">Personal website</span>
                                        <span id="website_text" class="mt-0.5 block break-all text-sm font-medium text-sky-700 group-hover:underline dark:text-sky-400">Visit website</span>
                                    </span>
                                </a>

                                <a id="contact_linkedin"
                                   href="#"
                                   target="_blank"
                                   rel="noopener noreferrer"
                                   class="group hidden items-center gap-3 rounded-lg border border-slate-200 p-3.5 transition hover:border-sky-300 hover:bg-sky-50/60 focus:outline-none focus-visible:ring-2 focus-visible:ring-sky-600 dark:border-slate-800 dark:hover:border-sky-700 dark:hover:bg-slate-800">
                                    <span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-lg bg-sky-700 text-sm font-bold text-white">
                                        in
                                    </span>
                                    <span class="min-w-0 flex-1">
                                        <span class="block text-xs text-slate-500 dark:text-slate-400">LinkedIn profile</span>
                                        <span id="linkedin_text" class="mt-0.5 block break-all text-sm font-medium text-sky-700 group-hover:underline dark:text-sky-400">View profile</span>
                                    </span>
                                </a>

                                <p id="no_online_profiles"
                                   class="hidden rounded-lg border border-dashed border-slate-300 px-4 py-5 text-center text-sm text-slate-500 sm:col-span-2 dark:border-slate-700 dark:text-slate-400">
                                    No online profiles added.
                                </p>
                            </div>
                        </section>

                        <!-- Additional social links -->
                        <section id="social_links_section" class="hidden" aria-labelledby="social_heading">
                            <h4 id="social_heading" class="text-sm font-semibold text-slate-900 dark:text-white">
                                Other social links
                            </h4>
                            <div id="contact_social_links" class="mt-3 grid grid-cols-1 gap-3 sm:grid-cols-2"></div>
                        </section>

                    </div>
                </div>

                <!-- Footer -->
                <div class="flex justify-end border-t border-slate-200 bg-slate-50 px-6 py-4 dark:border-slate-800 dark:bg-slate-900">
                    <button type="button"
                            onclick="closeContactModal()"
                            class="rounded-lg bg-slate-900 px-5 py-2.5 text-sm font-semibold text-white transition hover:bg-slate-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-sky-600 focus-visible:ring-offset-2 dark:bg-white dark:text-slate-900 dark:hover:bg-slate-200 dark:focus-visible:ring-offset-slate-900">
                        Close
                    </button>
                </div>

            </div>
        </div>
    </div>

</div>
