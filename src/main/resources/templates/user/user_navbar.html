<nav
    th:fragment="user-navbar"
    class="fixed top-0 start-0 z-20 w-full border-b border-gray-200
           bg-white dark:bg-gray-900 dark:border-gray-700 sm:pl-64"
>
    <div class="mx-auto flex max-w-screen-xl flex-wrap items-center
                justify-between gap-y-2 p-4">

        <!-- Sidebar toggle + Logo -->
        <div class="flex items-center gap-3">

            <button
                data-drawer-target="logo-sidebar"
                data-drawer-toggle="logo-sidebar"
                aria-controls="logo-sidebar"
                aria-label="Toggle sidebar"
                type="button"
                class="inline-flex items-center justify-center rounded-lg
                       p-2 text-gray-500 hover:bg-gray-100
                       focus:outline-none focus:ring-2 focus:ring-gray-200
                       dark:text-gray-400 dark:hover:bg-gray-700
                       dark:focus:ring-gray-600 sm:hidden"
            >
                <svg class="h-6 w-6" aria-hidden="true"
                     fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" clip-rule="evenodd"
                          d="M2 4.75A.75.75 0 012.75 4h14.5a.75.75 0 010 1.5H2.75A.75.75 0 012 4.75zm0 10.5a.75.75 0 01.75-.75h7.5a.75.75 0 010 1.5h-7.5a.75.75 0 01-.75-.75zM2 10a.75.75 0 01.75-.75h14.5a.75.75 0 010 1.5H2.75A.75.75 0 012 10z"/>
                </svg>
            </button>

            <a href="#" class="flex shrink-0 items-center gap-2">
                <img
                    th:src="@{/images/telephone.png}"
                    class="h-7"
                    alt="SCM Logo"
                />
                <span class="text-xl font-semibold text-gray-900
                             dark:text-white">
                    SCM
                </span>
            </a>
        </div>

        <!-- Desktop actions + Mobile hamburger -->
        <div class="flex items-center gap-2 md:order-3">

            <!-- Desktop-only actions -->
            <div class="hidden items-center gap-2 md:flex">

                <!-- Theme toggle -->
                <button
                    id="theme_change_button"
                    type="button"
                    class="inline-flex items-center gap-2 rounded-lg
                           bg-gray-100 px-3 py-2 text-sm font-medium
                           text-gray-700 transition hover:bg-gray-200
                           dark:bg-gray-700 dark:text-white
                           dark:hover:bg-gray-600"
                >
                    <i class="fa-solid fa-circle-half-stroke"></i>
                    <span>Dark</span>
                </button>

                <!-- Profile -->
                <a
                    th:href="@{/user/profile}"
                    class="inline-flex items-center gap-2 rounded-lg
                           px-2 py-1.5 transition hover:bg-indigo-50
                           dark:hover:bg-gray-800"
                >
                    <span class="flex h-8 w-8 shrink-0 items-center
                                 justify-center rounded-full bg-indigo-100
                                 text-indigo-700 dark:bg-indigo-900
                                 dark:text-indigo-300">
                        <i class="fa-solid fa-user text-sm"></i>
                    </span>

                    <span
                        class="max-w-28 truncate text-sm font-semibold
                               text-gray-800 dark:text-white"
                        th:text="${loggedInUser.name}">
                    </span>
                </a>

                <!-- Logout -->
                <a
                    th:href="@{/logout}"
                    title="Logout"
                    class="inline-flex items-center justify-center gap-2
                           rounded-lg border border-red-200 px-3 py-2
                           text-sm font-medium text-red-600
                           transition hover:border-red-300 hover:bg-red-50
                           dark:border-red-900 dark:text-red-400
                           dark:hover:bg-red-950"
                >
                    <i class="fa-solid fa-arrow-right-from-bracket"></i>
                    <span>Logout</span>
                </a>
            </div>

            <!-- Mobile hamburger: opens main menu -->
            <button
                data-collapse-toggle="navbar-sticky"
                type="button"
                class="inline-flex h-10 w-10 items-center justify-center
                       rounded-lg text-gray-500 hover:bg-gray-100
                       focus:outline-none focus:ring-2 focus:ring-gray-200
                       dark:text-gray-400 dark:hover:bg-gray-700
                       dark:focus:ring-gray-600 md:hidden"
                aria-controls="navbar-sticky"
                aria-expanded="false"
                aria-label="Open main menu"
            >
                <svg class="h-6 w-6" aria-hidden="true"
                     fill="none" viewBox="0 0 24 24">
                    <path stroke="currentColor" stroke-linecap="round"
                          stroke-width="2"
                          d="M5 7h14M5 12h14M5 17h14"/>
                </svg>
            </button>
        </div>

        <!-- Collapsible main menu -->
        <div
            id="navbar-sticky"
            class="hidden w-full md:order-2 md:block md:w-auto"
        >
            <div class="mt-3 flex flex-col gap-3 rounded-xl border
                        border-gray-200 bg-gray-50 p-3
                        dark:border-gray-700 dark:bg-gray-800
                        md:mt-0 md:flex-row md:items-center md:gap-8
                        md:border-0 md:bg-transparent md:p-0
                        md:dark:bg-transparent">

                <!-- Navigation links -->
                <ul class="flex flex-col gap-1 font-medium
                           md:flex-row md:items-center md:gap-8">

                    <li>
                        <a
                            th:href="@{/home}"
                            class="block rounded-lg px-3 py-2 text-gray-900
                                   hover:bg-gray-100 dark:text-white
                                   dark:hover:bg-gray-700
                                   md:px-0 md:py-1
                                   md:hover:bg-transparent
                                   md:dark:hover:bg-transparent"
                        >
                            Home
                        </a>
                    </li>

                    <li>
                        <a
                            th:href="@{/about}"
                            class="block rounded-lg px-3 py-2 text-gray-900
                                   hover:bg-gray-100 dark:text-white
                                   dark:hover:bg-gray-700
                                   md:px-0 md:py-1
                                   md:hover:bg-transparent
                                   md:dark:hover:bg-transparent"
                        >
                            About
                        </a>
                    </li>

                    <li>
                        <a
                            th:href="@{/services}"
                            class="block rounded-lg px-3 py-2 text-gray-900
                                   hover:bg-gray-100 dark:text-white
                                   dark:hover:bg-gray-700
                                   md:px-0 md:py-1
                                   md:hover:bg-transparent
                                   md:dark:hover:bg-transparent"
                        >
                            Services
                        </a>
                    </li>

                    <li>
                        <a
                            th:href="@{/contact}"
                            class="block rounded-lg px-3 py-2 text-gray-900
                                   hover:bg-gray-100 dark:text-white
                                   dark:hover:bg-gray-700
                                   md:px-0 md:py-1
                                   md:hover:bg-transparent
                                   md:dark:hover:bg-transparent"
                        >
                            Contact
                        </a>
                    </li>
                </ul>

                <!-- Mobile-only actions -->
                <div class="flex flex-col gap-2 border-t border-gray-200
                            pt-3 dark:border-gray-700 md:hidden">

                    <!-- Theme toggle -->
                    <button
                        id="theme_change_button_mobile"
                        type="button"
                        class="inline-flex w-full items-center gap-3
                               rounded-lg bg-white px-3 py-2.5
                               text-sm font-medium text-gray-700
                               transition hover:bg-gray-100
                               dark:bg-gray-900 dark:text-white
                               dark:hover:bg-gray-700"
                    >
                        <i class="fa-solid fa-circle-half-stroke"></i>
                        <span>Dark Mode</span>
                    </button>

                    <!-- Profile -->
                    <a
                        th:href="@{/user/profile}"
                        class="flex items-center gap-3 rounded-lg
                               px-3 py-2.5 transition hover:bg-indigo-50
                               dark:hover:bg-gray-700"
                    >
                        <span class="flex h-9 w-9 shrink-0 items-center
                                     justify-center rounded-full
                                     bg-indigo-100 text-indigo-700
                                     dark:bg-indigo-900 dark:text-indigo-300">
                            <i class="fa-solid fa-user"></i>
                        </span>

                        <span class="min-w-0">
                            <span class="block text-xs text-gray-500
                                         dark:text-gray-400">
                                Signed in as
                            </span>
                            <span
                                class="block truncate text-sm font-semibold
                                       text-gray-900 dark:text-white"
                                th:text="${loggedInUser.name}">
                            </span>
                        </span>
                    </a>

                    <!-- Logout -->
                    <a
                        th:href="@{/logout}"
                        class="inline-flex w-full items-center gap-3
                               rounded-lg border border-red-200
                               px-3 py-2.5 text-sm font-medium
                               text-red-600 transition hover:bg-red-50
                               dark:border-red-900 dark:text-red-400
                               dark:hover:bg-red-950"
                    >
                        <i class="fa-solid fa-arrow-right-from-bracket"></i>
                        <span>Logout</span>
                    </a>
                </div>
            </div>
        </div>

    </div>
</nav>
