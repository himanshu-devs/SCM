<!DOCTYPE html>
<html lang="en"
      th:replace="~{base :: parent(~{::#content}, ~{::title}, ~{::script})}">
<head>
    <title>Signup | Smart Contact Manager</title>
</head>
<body>

<div id="content">

    <div class="min-h-screen flex items-center justify-center px-4 py-10">

        <div class="w-full max-w-xl">

            <div class="p-6 sm:p-8 bg-white border-t-8 border-blue-700 rounded-lg shadow-md
                        dark:bg-slate-900 dark:border-blue-700">

                <div th:replace="message :: messagebox"></div>

                <h1 class="mb-1 text-2xl font-bold tracking-tight text-gray-900 dark:text-white">
                    Create your account
                </h1>
                <p class="mb-6 text-gray-500 dark:text-gray-400">
                    Start managing your contacts in the cloud.
                </p>

                <!-- NOTE: multipart/form-data is required for the image upload -->
                <form data-th-action="@{'/do-register'}" method="post"
                      enctype="multipart/form-data"
                      data-th-object="${userForm}" class="space-y-5"
                      id="signupForm" novalidate>

                    <!-- Profile image -->
                    <div>
                        <span class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">
                            Profile picture
                            <span class="font-normal text-gray-400">(optional)</span>
                        </span>

                        <div class="flex items-center gap-5">
                            <!-- Preview -->
                            <div id="avatarWrap"
                                 class="relative shrink-0 w-24 h-24 rounded-full overflow-hidden
                                        bg-gray-100 dark:bg-gray-700 border-2 border-dashed
                                        border-gray-300 dark:border-gray-500
                                        flex items-center justify-center">
                                <svg id="avatarPlaceholder" class="w-10 h-10 text-gray-400"
                                     fill="currentColor" viewBox="0 0 20 20" aria-hidden="true">
                                    <path d="M10 9a4 4 0 100-8 4 4 0 000 8zm-7 9a7 7 0 1114 0H3z"/>
                                </svg>
                                <img id="avatarPreview" alt="Profile picture preview"
                                     class="hidden w-full h-full object-cover">
                            </div>

                            <!-- Picker -->
                            <div class="flex-1 min-w-0">
                                <label for="profileImage" id="dropZone"
                                       class="flex flex-col items-center justify-center w-full px-4 py-4
                                              text-center border-2 border-dashed rounded-lg cursor-pointer
                                              border-gray-300 bg-gray-50 hover:bg-gray-100
                                              dark:border-gray-600 dark:bg-gray-700 dark:hover:bg-gray-600">
                                    <span class="text-sm text-gray-600 dark:text-gray-300">
                                        <span class="font-semibold text-blue-700 dark:text-blue-400">Choose a photo</span>
                                        or drag it here
                                    </span>
                                    <span class="mt-1 text-xs text-gray-500 dark:text-gray-400">
                                        JPG, PNG or WEBP, up to 2 MB
                                    </span>
                                    <span id="fileName"
                                          class="mt-1 text-xs text-gray-700 dark:text-gray-200 truncate max-w-full"></span>
                                </label>

                                <input type="file" id="profileImage" th:field="*{profileImage}"
                                       accept="image/png, image/jpeg, image/webp" class="sr-only">

                                <button type="button" id="removeImage"
                                        class="hidden mt-2 text-xs font-medium text-red-600 hover:underline
                                               focus:outline-none focus:ring-2 focus:ring-red-300 rounded">
                                    Remove photo
                                </button>
                            </div>
                        </div>

                        <p id="imageError" class="hidden text-red-600 text-sm pt-2" role="alert"></p>
                        <p data-th-if="${#fields.hasErrors('profileImage')}"
                           data-th-errors="*{profileImage}"
                           class="text-red-600 text-sm pt-2"></p>
                    </div>

                    <!-- Name -->
                    <div>
                        <label for="name"
                               class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">
                            Full name
                        </label>
                        <input type="text" id="name" th:field="*{name}"
                               placeholder="Your full name" autocomplete="name" required
                               class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg
                                      focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5
                                      dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400
                                      dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500">
                        <p data-th-if="${#fields.hasErrors('name')}"
                           data-th-errors="*{name}"
                           class="text-red-600 text-sm pt-1"></p>
                    </div>

                    <!-- Email -->
                    <div>
                        <label for="email"
                               class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">
                            Email
                        </label>
                        <input type="email" id="email" th:field="*{email}"
                               placeholder="name@example.com" autocomplete="email" required
                               class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg
                                      focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5
                                      dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400
                                      dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500">
                        <p data-th-if="${#fields.hasErrors('email')}"
                           data-th-errors="*{email}"
                           class="text-red-600 text-sm pt-1"></p>
                    </div>

                    <!-- Password -->
                    <div>
                        <label for="password"
                               class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">
                            Password
                        </label>
                        <div class="relative">
                            <input type="password" id="password" th:field="*{password}"
                                   autocomplete="new-password" required minlength="6"
                                   class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg
                                          focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 pr-16
                                          dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400
                                          dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500">
                            <button type="button" id="togglePassword"
                                    class="absolute inset-y-0 right-0 px-3 text-xs font-medium
                                           text-blue-700 dark:text-blue-400 hover:underline
                                           focus:outline-none focus:ring-2 focus:ring-blue-300 rounded-r-lg"
                                    aria-controls="password" aria-pressed="false">
                                Show
                            </button>
                        </div>

                        <!-- Strength meter -->
                        <div class="mt-2 flex gap-1" aria-hidden="true">
                            <div class="strength-bar h-1 flex-1 rounded bg-gray-200 dark:bg-gray-700"></div>
                            <div class="strength-bar h-1 flex-1 rounded bg-gray-200 dark:bg-gray-700"></div>
                            <div class="strength-bar h-1 flex-1 rounded bg-gray-200 dark:bg-gray-700"></div>
                            <div class="strength-bar h-1 flex-1 rounded bg-gray-200 dark:bg-gray-700"></div>
                        </div>
                        <p id="strengthText" class="mt-1 text-xs text-gray-500 dark:text-gray-400"
                           aria-live="polite">Use 8 or more characters with a mix of letters, numbers and symbols.</p>

                        <p data-th-if="${#fields.hasErrors('password')}"
                           data-th-errors="*{password}"
                           class="text-red-600 text-sm pt-1"></p>
                    </div>

                    <!-- Phone -->
                    <div>
                        <label for="phone"
                               class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">
                            Phone number
                        </label>
                        <input type="tel" id="phone" th:field="*{phoneNumber}"
                               placeholder="10-digit mobile number" autocomplete="tel"
                               inputmode="numeric" required
                               class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg
                                      focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5
                                      dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400
                                      dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500">
                        <p data-th-if="${#fields.hasErrors('phoneNumber')}"
                           data-th-errors="*{phoneNumber}"
                           class="text-red-600 text-sm pt-1"></p>
                    </div>

                    <!-- About -->
                    <div>
                        <div class="flex items-baseline justify-between mb-2">
                            <label for="about"
                                   class="text-sm font-medium text-gray-900 dark:text-white">
                                About you
                                <span class="font-normal text-gray-400">(optional)</span>
                            </label>
                            <span id="aboutCount" class="text-xs text-gray-400">0 / 250</span>
                        </div>
                        <textarea id="about" rows="4" maxlength="250" th:field="*{about}"
                                  placeholder="A short line about yourself"
                                  class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg
                                         focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5
                                         dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400
                                         dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"></textarea>
                        <p data-th-if="${#fields.hasErrors('about')}"
                           data-th-errors="*{about}"
                           class="text-red-600 text-sm pt-1"></p>
                    </div>

                    <!-- Buttons -->
                    <div class="flex flex-col-reverse sm:flex-row sm:justify-end gap-3 pt-2">
                        <button type="reset" id="resetBtn"
                                class="text-gray-800 bg-gray-100 hover:bg-gray-200 border border-gray-300
                                       dark:text-white dark:bg-gray-800 dark:border-gray-600 dark:hover:bg-gray-700
                                       focus:ring-4 focus:ring-gray-300 font-medium rounded-lg text-sm px-5 py-2.5">
                            Reset
                        </button>
                        <button type="submit"
                                class="text-white bg-blue-700 hover:bg-blue-800
                                       focus:ring-4 focus:ring-blue-300 font-medium rounded-lg
                                       text-sm px-5 py-2.5">
                            Create account
                        </button>
                    </div>

                    <p class="text-sm text-center text-gray-500 dark:text-gray-400">
                        Already have an account?
                        <a data-th-href="@{/login}"
                           class="font-medium text-blue-700 dark:text-blue-400 hover:underline">Log in</a>
                    </p>

                </form>
            </div>
        </div>
    </div>
</div>

<script>
    (function () {
        const MAX_SIZE = 2 * 1024 * 1024; // 2 MB
        const ALLOWED = ['image/jpeg', 'image/png', 'image/webp'];

        const input = document.getElementById('profileImage');
        const preview = document.getElementById('avatarPreview');
        const placeholder = document.getElementById('avatarPlaceholder');
        const fileName = document.getElementById('fileName');
        const removeBtn = document.getElementById('removeImage');
        const errorEl = document.getElementById('imageError');
        const dropZone = document.getElementById('dropZone');

        function showError(msg) {
            errorEl.textContent = msg;
            errorEl.classList.remove('hidden');
        }

        function clearImage() {
            input.value = '';
            preview.src = '';
            preview.classList.add('hidden');
            placeholder.classList.remove('hidden');
            fileName.textContent = '';
            removeBtn.classList.add('hidden');
        }

        function handleFile(file) {
            errorEl.classList.add('hidden');
            if (!file) { clearImage(); return; }

            if (!ALLOWED.includes(file.type)) {
                clearImage();
                showError('Choose a JPG, PNG or WEBP image.');
                return;
            }
            if (file.size > MAX_SIZE) {
                clearImage();
                showError('That image is larger than 2 MB. Choose a smaller one.');
                return;
            }

            const reader = new FileReader();
            reader.onload = function (e) {
                preview.src = e.target.result;
                preview.classList.remove('hidden');
                placeholder.classList.add('hidden');
                fileName.textContent = file.name;
                removeBtn.classList.remove('hidden');
            };
            reader.readAsDataURL(file);
        }

        input.addEventListener('change', function () { handleFile(input.files[0]); });
        removeBtn.addEventListener('click', clearImage);
        document.getElementById('resetBtn').addEventListener('click', function () {
            clearImage();
            errorEl.classList.add('hidden');
        });

        // Drag and drop
        ['dragenter', 'dragover'].forEach(function (ev) {
            dropZone.addEventListener(ev, function (e) {
                e.preventDefault();
                dropZone.classList.add('border-blue-500');
            });
        });
        ['dragleave', 'drop'].forEach(function (ev) {
            dropZone.addEventListener(ev, function (e) {
                e.preventDefault();
                dropZone.classList.remove('border-blue-500');
            });
        });
        dropZone.addEventListener('drop', function (e) {
            const file = e.dataTransfer.files[0];
            if (!file) return;
            const dt = new DataTransfer();
            dt.items.add(file);
            input.files = dt.files;
            handleFile(file);
        });

        // Show / hide password
        const pw = document.getElementById('password');
        const toggle = document.getElementById('togglePassword');
        toggle.addEventListener('click', function () {
            const show = pw.type === 'password';
            pw.type = show ? 'text' : 'password';
            toggle.textContent = show ? 'Hide' : 'Show';
            toggle.setAttribute('aria-pressed', String(show));
        });

        // Password strength
        const bars = document.querySelectorAll('.strength-bar');
        const strengthText = document.getElementById('strengthText');
        const levels = [
            { label: 'Too weak', color: 'bg-red-500' },
            { label: 'Weak', color: 'bg-orange-500' },
            { label: 'Good', color: 'bg-yellow-500' },
            { label: 'Strong', color: 'bg-green-500' }
        ];
        const colorClasses = levels.map(function (l) { return l.color; });

        pw.addEventListener('input', function () {
            const v = pw.value;
            let score = 0;
            if (v.length >= 8) score++;
            if (/[a-z]/.test(v) && /[A-Z]/.test(v)) score++;
            if (/\d/.test(v)) score++;
            if (/[^A-Za-z0-9]/.test(v)) score++;

            bars.forEach(function (bar, i) {
                bar.classList.remove.apply(bar.classList, colorClasses);
                if (v && i < score) bar.classList.add(levels[score - 1].color);
            });
            strengthText.textContent = v
                ? 'Password strength: ' + levels[Math.max(score - 1, 0)].label
                : 'Use 8 or more characters with a mix of letters, numbers and symbols.';
        });

        // About counter
        const about = document.getElementById('about');
        const counter = document.getElementById('aboutCount');
        function updateCount() { counter.textContent = about.value.length + ' / 250'; }
        about.addEventListener('input', updateCount);
        updateCount();

        // Phone: digits only
        document.getElementById('phone').addEventListener('input', function (e) {
            e.target.value = e.target.value.replace(/[^\d+]/g, '');
        });
    })();
</script>

</body>
</html>
